version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused

  settings:
    errcheck:
      check-type-assertions: false
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]

  exclusions:
    rules:
      # Test helpers assert on values the test itself constructed.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
