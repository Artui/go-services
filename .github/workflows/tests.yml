name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # One job per module, each at that module's own declared floor.
  #
  # A single Go version across the matrix cannot work here: the modules floor at
  # 1.24, 1.25 and 1.26, so any one version is either below a module's floor or
  # above it. setup-go v7 sets GOTOOLCHAIN=local, which is what makes that
  # visible -- under v5 an older toolchain silently downloaded the newer one and
  # the leg named for a floor was testing something else entirely.
  #
  # The version comes from go-version-file rather than a literal, so the floor
  # is declared once, in the module's own go.mod, and this file cannot drift
  # from it.
  floor:
    name: floor (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "httpx", "ginx", "mcpx", "conformance", "example"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: vet and test at the declared floor
        working-directory: ${{ matrix.module }}
        run: |
          go version
          go vet ./...
          go test -race ./...

  # Everything together on the current release, which is what most consumers run.
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make fmt-check
      - run: make vet
      - run: make test-race
      # The workspace file is gitignored, so CI already resolves each module on
      # its own. This makes that a stated check rather than a side effect.
      - run: make verify-modules
      - run: make check-floors

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "httpx", "ginx", "mcpx", "conformance", "example"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          working-directory: ${{ matrix.module }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make cover

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so the scan sees the whole PR range
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan repo and history
        run: gitleaks git --redact --no-banner .

  # A roll-up so branch protection requires one context instead of the matrix
  # legs by name. Requiring the legs means a new module merges unrequired, and a
  # dropped one leaves a required context that never reports and blocks every
  # pull request forever.
  tests-passed:
    name: tests
    if: always()
    needs: [floor, stable, lint, coverage, secrets]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
