name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # One job per module, each at that module's own declared floor.
  #
  # A single Go version across the matrix cannot work here: the modules floor at
  # 1.24, 1.25 and 1.26, so any one version is either below a module's floor or
  # above it. setup-go v7 sets GOTOOLCHAIN=local, which is what makes that
  # visible -- under v5 an older toolchain silently downloaded the newer one and
  # the leg named for a floor was testing something else entirely.
  #
  # The version comes from go-version-file rather than a literal, so the floor
  # is declared once, in the module's own go.mod, and this file cannot drift
  # from it.
  floor:
    name: floor (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "httpx", "ginx", "mcpx", "adkx", "aguix", "conformance", "example"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: vet and test at the declared floor
        working-directory: ${{ matrix.module }}
        run: |
          go version
          go vet ./...
          go test -race ./...

  # Everything together on the current release, which is what most consumers run.
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make fmt-check
      - run: make vet
      - run: make test-race
      # The workspace file is gitignored, so CI already resolves each module on
      # its own. This makes that a stated check rather than a side effect.
      - run: make verify-modules
      # A module's go.mod is metadata a published tag freezes forever, so the
      # tidiness check runs beside the resolution one rather than being left to
      # whoever remembers the mutating target.
      - run: make tidy-check
      - run: make check-floors

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "httpx", "ginx", "mcpx", "adkx", "aguix", "conformance", "example"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          working-directory: ${{ matrix.module }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make cover

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so the scan sees the whole PR range
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan repo and history
        run: gitleaks git --redact --no-banner .

  # A roll-up so branch protection requires one context instead of the matrix
  # legs by name. Requiring the legs means a new module merges unrequired, and a
  # dropped one leaves a required context that never reports and blocks every
  # pull request forever.
  tests-passed:
    name: tests
    # always(), never !cancelled(): a skipped job reports a skipped check, and
    # branch protection counts a skipped required check as passing.
    if: always()
    needs: [floor, stable, lint, coverage, secrets]
    runs-on: ubuntu-latest
    steps:
      # Pass on an exact `success` from every job above, rather than failing on
      # a list of bad results: such a list passes whatever it does not name, and
      # GitHub reports a result it does not document. A job no hosted runner
      # ever picks up ("The job was not acquired by Runner of type hosted even
      # after multiple attempts") shows as cancelled on its own check but
      # reaches `needs` as `abandoned`, and a gate that failed only on `failure`
      # and `cancelled` went green over exactly that while the jobs it guards
      # never ran. A matrix reaches `needs` as one result, and one cell that did
      # not succeed is enough to make it something other than `success`.
      #
      # None of the jobs above has an `if:`, so `skipped` can only mean one of
      # them never ran, and it fails like any other result. A job that gains a
      # legitimate skip gets an exception naming it, never `skipped` accepted
      # from all of them.
      #
      # The results come in through `env` rather than being spliced into the
      # script, and every one is printed, so a red gate says which job and what
      # GitHub reported for it.
      - name: Verify every required job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          not_ok="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"] | join(" ")')"
          if [ -n "$not_ok" ]; then
            echo "::error::required jobs did not succeed: $not_ok"
            exit 1
          fi
