repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: go-fmt
        name: "gofmt"
        entry: make fmt
        pass_filenames: false
        language: system
        stages: [pre-commit]

      - id: go-vet
        name: "go vet"
        entry: make vet
        pass_filenames: false
        language: system
        stages: [pre-commit]

      # The four workspace convention guards, ported. The first, second and
      # fourth are unchanged; the third has no Python to guard, so it guards the
      # Go equivalent -- a suppression with no stated reason.
      - id: forbid-local-paths
        name: "forbid local filesystem paths / personal handles"
        entry: "/Users/|arturveres"
        language: pygrep
        types: [text]
        exclude: '^\.pre-commit-config\.yaml$'

      - id: forbid-plan-labels
        name: "forbid internal plan-step labels"
        entry: '(?<![A-Za-z0-9])(SPEC|SURF|DISP|KEY|FILT|BULK|NEST|NAME|THINK|VOICE|THEME|WELL|PAGE|CARD|REST|I18N|CUST|TOOL|PAI|AUTHZ|CONF|AGH|OAS|WCH|HYG|ADOPT|ANNO|ASYNC|ERR|DUP|PROTO|SEC|VER|GATE|STATE|SESS|CTX|AUDIT|HITL|CODE|STEP|SHARE|SKILL|CAP|MOUNT|SAN|PF|PROV|SCH|LIFE|SUB|CI|DOC|EX|HOST|WIN|REL|CONV|COMM|LINT|PURGE|MCPX|A2A|ATT|ADMIN|MULTI|OFFK|QP|DEPS|CORE|NAV|TSET|MRTR|BOUND|CHAT|NICE|PRE|PIPE|EMIT|SEED|POOL|GOSVC)-\d|(?<![A-Za-z0-9])(Phase|Wave)\s\d'
        language: pygrep
        types: [text]
        exclude: '^\.pre-commit-config\.yaml$'

      # A bare //nolint says a linter was wrong without saying why. Require the
      # form golangci-lint understands and a human can audit:
      #   //nolint:linter // the reason
      - id: forbid-unexplained-nolint
        name: "forbid //nolint without a linter and a reason"
        entry: '//nolint(?!:[a-z0-9,]+ // \S)'
        language: pygrep
        files: '\.go$'
        exclude: '^\.pre-commit-config\.yaml$'

      # The architectural boundary this package exists to hold: the kernel is
      # what every adapter reads, so it must not know about any of them. Adapter
      # code lives in its own module directory, never at the root.
      - id: forbid-adapter-imports-in-kernel
        name: "no transport imports in the kernel (it sits below all of them)"
        # Matches the quoted import path rather than the bare name, because the
        # rule is about what the kernel imports and not about what its comments
        # may mention. The loose version fired on a comment explaining why path
        # syntax cannot be shared between two HTTP adapters, which is exactly
        # the kind of explanation this file wants to keep.
        entry: '"(net/http|github\.com/gin-gonic/|github\.com/modelcontextprotocol/|google\.golang\.org/adk/|google\.golang\.org/genai)'
        language: pygrep
        files: '^[^/]+\.go$'
        exclude: '^\.pre-commit-config\.yaml$'

      - id: forbid-marker-glyphs
        name: "forbid emoji / marker glyphs in code, docs and changelogs"
        entry: '⚠|⭐|⛔|✅|❌|❗|❓|⭕|⚡|☑|✔|✖|✨|❤|⏸|⏰|⌛|⁉|‼|️|\xf0\x9f[\x80-\xbf][\x80-\xbf]'
        language: pygrep
        types: [text]
        exclude: '^\.pre-commit-config\.yaml$'

      # Structural rather than a pattern, so it is a script where the guards
      # above are pygrep. A merge or a rebase can rearrange this file without
      # conflicting: a released heading and an unreleased entry insert after the
      # same line, git resolves them silently, and shipped work ends up filed
      # under a version already published. It has happened four times across two
      # repositories and every catch was a habit rather than a gate.
      - id: check-changelog
        name: "check CHANGELOG structure (merge and rebase leave it silently wrong)"
        entry: scripts/check-changelog
        language: script
        files: '^CHANGELOG\.md$'
